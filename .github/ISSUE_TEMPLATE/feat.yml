name: Feature Request
description: Propose a new idea, enhancement, or architectural improvement.
title: "feat(scope): title"
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        ## 📋 Triage
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Which area of the project does this feature primarily affect?
      options:
        - core (Core logic, engine, or shared libraries)
        - interface (UI, CLI commands, or API endpoints)
        - integration (Data flow, plugins, or third-party connections)
        - experience (UX, performance, or workflow polish)
        - other (Please specify in the summary)
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: How much value does this add to the project?
      options:
        - Suggestion (Small "nice-to-have" polish)
        - Minor (Useful improvement for specific use cases)
        - Major (Significant value for a majority of users)
        - Critical (Foundational requirement for the project's success)
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## 💡 Proposal
  - type: textarea
    id: user-story
    attributes:
      label: User Story
      description: Explain the need from the perspective of a user or developer.
      placeholder: "As a [user type], I want to [action] so that [benefit]."
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: What verifiable requirements must be met for this to be "done"?
      placeholder: |
        - [ ] Feature X is accessible via [command/button]
        - [ ] Documentation reflects the new changes
        - [ ] Performance remains within [X] limits
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Mockups, research, technical constraints, or similar features in other tools.
